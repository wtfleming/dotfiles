name: lint

# A push to a PR branch matches both triggers, which started two identical runs
# on the same commit. Limiting push to main leaves branch pushes to the
# pull_request run, and keeps direct pushes to main covered.
on:
  push:
    branches: [main]
  pull_request:

# Supersede a PR's own earlier runs: a follow-up commit makes the previous
# verdict irrelevant, and these jobs are slow enough to still be queued when it
# lands. Pushes to main are never cancelled, so every commit there keeps a
# verdict of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck and jq are preinstalled on ubuntu-latest runners
      - name: shellcheck
        run: shellcheck sync-dotfiles.sh install-dependencies-macos.sh bin/* Dotfiles/claude/hooks/*.sh Dotfiles/claude/scripts/*.sh

      - name: validate claude settings.json
        run: jq empty Dotfiles/claude/settings.json

  # Its own job because it installs emacs, which takes minutes and dwarfs
  # everything in `lint` -- the tangle it exists to run takes about a second.
  # Separated so shellcheck reports in seconds rather than behind an apt-get, and
  # so a stale init.el is distinguishable from a lint failure without opening the
  # log.
  tangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # init.el is generated from init.org but is the file sync-dotfiles.sh
      # deploys, so a forgotten tangle ships a config the source no longer
      # describes. Re-tangle and fail if anything moved.
      #
      # Delete the generated files first: tangling overwrites, so without this a
      # target dropped from init.org would sit there stale and unnoticed. Stage
      # before diffing, because plain `git diff` ignores untracked files -- a
      # newly added :tangle target that was never committed would otherwise
      # generate cleanly in CI and pass. Only these two files are removed;
      # Dotfiles/emacs.d/ also holds hand-maintained assets.
      - name: init.el and early-init.el match init.org
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq emacs-nox
          rm -f Dotfiles/emacs.d/init.el Dotfiles/emacs.d/early-init.el
          emacs -Q --batch -l ob-tangle --eval '(org-babel-tangle-file "Dotfiles/emacs.d/init.org")'
          git add -A -- Dotfiles/emacs.d/
          git diff --cached --exit-code -- Dotfiles/emacs.d/
