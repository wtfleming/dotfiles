name: lint

# A push to a PR branch matches both triggers, which started two identical runs
# on the same commit. Limiting push to main leaves branch pushes to the
# pull_request run, and keeps direct pushes to main covered.
on:
  push:
    branches: [main]
  pull_request:

# Supersede a PR's own earlier runs: a follow-up commit makes the previous
# verdict irrelevant. Pushes to main are never cancelled, so every commit there
# keeps a verdict of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repo default is a write-capable token, which this job does not need -- it
# reads the tree and lints it, and never pushes.
permissions:
  contents: read

# The checkout names the commit v7 resolves to rather than the tag, which can be
# repointed at other code; .github/dependabot.yml keeps the pin fresh.
# persist-credentials: false because nothing after checkout uses the token.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # shellcheck and jq are preinstalled on ubuntu-latest runners
      - name: shellcheck
        run: shellcheck sync-dotfiles.sh install-dependencies-macos.sh bin/* Dotfiles/claude/hooks/*.sh Dotfiles/claude/scripts/*.sh Dotfiles/claude/skills/*/scripts/*.sh Dotfiles/claude/tests/*.sh

      - name: validate claude settings.json
        run: jq empty Dotfiles/claude/settings.json

      # Everything else here is static, and resolve-scope.sh is almost entirely branching
      # -- the shape dispatch, the three-step fall-through, the correspondence states. It
      # is the single authority on what every review reads, so a wrong answer is a
      # confident report about the wrong code, and shellcheck cannot reach any of it.
      - name: resolve-scope smoke test
        run: Dotfiles/claude/tests/resolve-scope-smoke.sh

      # Same reasoning, and the same blind spot until now: baseline-worktree.sh builds and
      # destroys git worktrees under $TMPDIR, and its failure modes are a guard that does
      # not stop the run and half a pair left registered for the next one to trip over.
      - name: baseline-worktree smoke test
        run: Dotfiles/claude/tests/baseline-worktree-smoke.sh

      # A skill, agent or command whose YAML header does not parse registers wrong or
      # not at all, and nothing else here would notice -- shellcheck skips markdown and
      # jq only sees settings.json.
      - name: validate frontmatter
        run: |
          python3 -c 'import yaml' \
            || { echo "PyYAML missing on the runner — install it before this step" >&2; exit 1; }
          rc=0
          for f in Dotfiles/claude/skills/*/SKILL.md Dotfiles/claude/agents/*.md Dotfiles/claude/commands/*.md; do
            # Command substitution, not a pipe: a pipe would mask awk's exit status and a
            # file with no header at all would parse as empty YAML and pass.
            # END guards the closing delimiter: without it an unterminated block runs to
            # EOF, awk exits 0, and a file with no closing --- passes as valid.
            header=$(awk '
              NR == 1 { if ($0 != "---") exit 1; next }
              /^---$/ { closed = 1; exit }
              { print }
              END { if (!closed) exit 1 }
            ' "$f") || { echo "no frontmatter block, or it is unterminated: $f" >&2; rc=1; continue; }
            printf '%s\n' "$header" \
              | python3 -c 'import sys, yaml; yaml.safe_load(sys.stdin)' \
              || { echo "invalid frontmatter: $f" >&2; rc=1; }
          done
          exit $rc
