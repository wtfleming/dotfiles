name: lint

# A push to a PR branch matches both triggers, which started two identical runs
# on the same commit. Limiting push to main leaves branch pushes to the
# pull_request run, and keeps direct pushes to main covered.
on:
  push:
    branches: [main]
  pull_request:

# Supersede a PR's own earlier runs: a follow-up commit makes the previous
# verdict irrelevant. Pushes to main are never cancelled, so every commit there
# keeps a verdict of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repo default is a write-capable token, which this job does not need -- it
# reads the tree and lints it, and never pushes.
permissions:
  contents: read

# The checkout names the commit v7 resolves to rather than the tag, which can be
# repointed at other code; .github/dependabot.yml keeps the pin fresh.
# persist-credentials: false because nothing after checkout uses the token.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # shellcheck and jq are preinstalled on ubuntu-latest runners
      - name: shellcheck
        run: shellcheck sync-dotfiles.sh install-dependencies-macos.sh bin/* Dotfiles/claude/scripts/*.sh Dotfiles/claude/skills/*/scripts/*.sh Dotfiles/claude/tests/*.sh Dotfiles/claude/evals/*/*.sh

      - name: validate claude settings.json
        run: jq empty Dotfiles/claude/settings.json

      # Everything else here is static, and resolve-scope.sh is almost entirely branching
      # -- the shape dispatch, the three-step fall-through, the correspondence states. It
      # is the single authority on what every review reads, so a wrong answer is a
      # confident report about the wrong code, and shellcheck cannot reach any of it.
      - name: resolve-scope smoke test
        run: Dotfiles/claude/tests/resolve-scope-smoke.sh

      # Same reasoning, and the same blind spot until now: baseline-worktree.sh builds and
      # destroys git worktrees under $TMPDIR, and its failure modes are a guard that does
      # not stop the run and half a pair left registered for the next one to trip over.
      - name: baseline-worktree smoke test
        run: Dotfiles/claude/tests/baseline-worktree-smoke.sh

      # publish-verify-section.sh rewrites a public PR description, so a wrong answer
      # deletes prose the author wrote somewhere that notifies watchers and cannot be
      # taken back. It lived as a fenced block in a markdown reference until now, where
      # the shellcheck glob could not see it and no test could run it.
      - name: publish-verify-section smoke test
        run: Dotfiles/claude/tests/publish-verify-section-smoke.sh

      # publish-check.sh is the last thing between a captured credential and a public PR,
      # so its failure modes are both silent: a scan that could not run reading as a clean
      # one, and a denylist line that matches everything or nothing.
      - name: publish-check smoke test
        run: Dotfiles/claude/tests/publish-check-smoke.sh

      # fix-snapshot.sh builds the diff a fix round's cold review reads, and its failure
      # mode is a diff that omits a file -- an untracked one, a deleted one -- in silence.
      - name: fix-snapshot smoke test
        run: Dotfiles/claude/tests/fix-snapshot-smoke.sh

      # diff-symbols.sh says which declarations a diff touched, so its failure modes are a
      # line credited to the wrong symbol and a file it could not parse dropped in silence.
      # The runner has no ast-grep; the version is pinned so a release cannot change what CI
      # asserts.
      - name: install ast-grep
        run: npm install --global @ast-grep/cli@0.51.2

      - name: diff-symbols smoke test
        run: Dotfiles/claude/tests/diff-symbols-smoke.sh

      # pr-wait.sh decides when a pushed commit's checks have finished, so its failure
      # modes are all a wrong ending: settled on the previous commit's results, or a long
      # wait thrown away by one failed poll. The test drives it with a stand-in gh.
      - name: pr-wait smoke test
        run: Dotfiles/claude/tests/pr-wait-smoke.sh

      # verify_geometry.py is the only check on a wtf-show-me page's connectors before a
      # person looks at it, so its failure mode is a broken connector passing. It is Python,
      # which the shellcheck glob does not reach.
      - name: verify-geometry smoke test
        run: Dotfiles/claude/tests/verify-geometry-smoke.sh

      # A skill, agent or command whose YAML header does not parse registers wrong or
      # not at all, and nothing else here would notice -- shellcheck skips markdown and
      # jq only sees settings.json.
      - name: validate frontmatter
        run: |
          python3 -c 'import yaml' \
            || { echo "PyYAML missing on the runner — install it before this step" >&2; exit 1; }
          rc=0
          for f in Dotfiles/claude/skills/*/SKILL.md Dotfiles/claude/agents/*.md Dotfiles/claude/commands/*.md; do
            # Command substitution, not a pipe: a pipe would mask awk's exit status and a
            # file with no header at all would parse as empty YAML and pass.
            # END guards the closing delimiter: without it an unterminated block runs to
            # EOF, awk exits 0, and a file with no closing --- passes as valid.
            header=$(awk '
              NR == 1 { if ($0 != "---") exit 1; next }
              /^---$/ { closed = 1; exit }
              { print }
              END { if (!closed) exit 1 }
            ' "$f") || { echo "no frontmatter block, or it is unterminated: $f" >&2; rc=1; continue; }
            printf '%s\n' "$header" \
              | python3 -c 'import sys, yaml; yaml.safe_load(sys.stdin)' \
              || { echo "invalid frontmatter: $f" >&2; rc=1; }
          done
          exit $rc

      # The step above proves a header parses, not that it registers under the name the
      # file promises. CLAUDE.md's rule is a wtf- prefix on the file name and the
      # registered name, and a collision with a project's own .claude/ resolves silently.
      # A missing description registers too, as something nothing can select.
      - name: validate registered names
        run: |
          python3 - <<'PY'
          import glob, os, sys, yaml

          def header(path):
              text = open(path, encoding="utf-8").read()
              return yaml.safe_load(text.split("\n---\n", 1)[0][4:]) or {}

          errors = []
          root = "Dotfiles/claude"
          found = {
              "skill": glob.glob(f"{root}/skills/*/SKILL.md"),
              "agent": glob.glob(f"{root}/agents/*.md"),
              "command": glob.glob(f"{root}/commands/*.md"),
          }
          for kind, paths in found.items():
              if not paths:
                  errors.append(f"no {kind} files found: the glob is wrong, not the tree")
              for path in sorted(paths):
                  fields = header(path)
                  stem = os.path.basename(os.path.dirname(path) if kind == "skill" else path[:-3])
                  if not stem.startswith("wtf-"):
                      errors.append(f"{path}: file name lacks the wtf- prefix")
                  # A command registers under its file name and has no name field.
                  if kind != "command" and fields.get("name") != stem:
                      errors.append(f"{path}: name is {fields.get('name')!r}, expected {stem!r}")
                  desc = fields.get("description")
                  if not isinstance(desc, str) or not desc.strip():
                      errors.append(f"{path}: description is missing or not a string")
          print("\n".join(errors) or "names and descriptions are consistent")
          sys.exit(1 if errors else 0)
          PY

      # These files are instructions an agent follows, and prose is ported into them from
      # other repositories. A character a reviewer cannot see is still read by the model:
      # the Unicode tag block mirrors ASCII invisibly, and zero-width and bidi characters
      # hide or reorder what is shown. A raw control byte also makes a file binary to grep.
      - name: reject invisible characters in agent instructions
        run: |
          python3 - <<'PY'
          import glob, sys

          def hidden(ch):
              o = ord(ch)
              return (
                  (o < 0x20 and ch not in "\t\n") or o == 0x7F
                  or 0x200B <= o <= 0x200F or 0x202A <= o <= 0x202E
                  or 0x2060 <= o <= 0x2069 or o == 0xFEFF
                  or 0xE0000 <= o <= 0xE007F
              )

          paths = sorted(glob.glob("Dotfiles/claude/**/*.md", recursive=True)) + ["CLAUDE.md"]
          if len(paths) < 2:
              sys.exit("no instruction files found: the glob is wrong, not the tree")
          bad = 0
          for path in paths:
              with open(path, encoding="utf-8", newline="") as fh:
                  for number, line in enumerate(fh, 1):
                      for ch in line:
                          if hidden(ch):
                              print(f"{path}:{number}: U+{ord(ch):04X}")
                              bad += 1
          print(f"{len(paths)} files, {bad} invisible characters")
          sys.exit(1 if bad else 0)
          PY
