name: tangle

# Split out of lint.yml and path-filtered because this job installs emacs, which
# takes minutes, while the tangle it exists to run takes about a second. Nothing
# outside these files can change the answer, so a push that only touches other
# dotfiles should not pay for it.
#
# Listing the three files rather than Dotfiles/emacs.d/** keeps the css/js assets
# and wtf-elisp/ from triggering it. That is still sufficient coverage: a new
# :tangle target can only appear by editing init.org, which is listed, so a
# generated file this workflow does not yet know about cannot be added without
# firing it.
#
# The list is written out twice because the Actions parser does not support YAML
# anchors -- and a local yaml.safe_load resolves them, so an anchored version
# validates cleanly here and is rejected on GitHub. Keep the two copies in step.
on:
  push:
    branches: [main]
    paths:
      - Dotfiles/emacs.d/init.org
      - Dotfiles/emacs.d/init.el
      - Dotfiles/emacs.d/early-init.el
      - .github/workflows/tangle.yml
  pull_request:
    paths:
      - Dotfiles/emacs.d/init.org
      - Dotfiles/emacs.d/init.el
      - Dotfiles/emacs.d/early-init.el
      - .github/workflows/tangle.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tangle:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v7 resolves to rather than the tag, which can be
      # repointed at other code; .github/dependabot.yml keeps the pin fresh.
      # persist-credentials: false because the git calls below are local and this
      # job never pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # init.el is generated from init.org but is the file sync-dotfiles.sh
      # deploys, so a forgotten tangle ships a config the source no longer
      # describes. Re-tangle and fail if anything moved.
      #
      # Delete the generated files first: tangling overwrites, so without this a
      # target dropped from init.org would sit there stale and unnoticed. Stage
      # before diffing, because plain `git diff` ignores untracked files -- a
      # newly added :tangle target that was never committed would otherwise
      # generate cleanly in CI and pass. Only these two files are removed;
      # Dotfiles/emacs.d/ also holds hand-maintained assets.
      - name: init.el and early-init.el match init.org
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq emacs-nox
          rm -f Dotfiles/emacs.d/init.el Dotfiles/emacs.d/early-init.el
          emacs -Q --batch -l ob-tangle --eval '(org-babel-tangle-file "Dotfiles/emacs.d/init.org")'
          git add -A -- Dotfiles/emacs.d/
          git diff --cached --exit-code -- Dotfiles/emacs.d/
